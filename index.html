<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#d9ecff" />
<meta name="description" content="心灵漂流瓶 —— 面向学生的匿名情绪分享与同伴互助平台。把心事放进瓶子，让温暖漂到你身边。" />
<title>心灵漂流瓶 · 把心事放进瓶子，让温暖漂到你身边</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ================= 主题变量 ================= */
:root{
  --font-display:"ZCOOL KuaiLe","Noto Sans SC",cursive;
  --font-letter:"ZCOOL XiaoWei","Noto Sans SC",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ink:#31405f;--ink-deep:#22304e;--ink-soft:#71809f;--ink-faint:#9aa7c2;
  --sea-50:#f2f8ff;--sea-100:#e4f0fc;--sea-200:#cde3f8;--sea-300:#aed0f0;--sea-400:#8cb8e6;--sea-500:#6b9bd8;--sea-600:#4f7fc0;--sea-700:#3d659e;
  --dusk-100:#efeaf9;--dusk-200:#e0d8f3;--dusk-300:#c9bce8;--dusk-400:#a996d6;--dusk-500:#8a74bf;
  --cream:#fdfaf3;--cream-deep:#f7f0e2;--line:#eadfca;
  --gold-100:#fdf3dd;--gold-300:#f6d491;--gold-400:#eebb62;--gold-500:#e0a63f;
  --coral-100:#fdeee8;--coral-300:#f7c3ab;--coral-400:#f09f7d;--coral-500:#e57f58;
  --blush-100:#fceef2;--blush-300:#f4c2d0;--blush-400:#ea9cb2;--blush-500:#dc7693;
  --mint-100:#e9f5ef;--mint-300:#b7dcc8;--mint-500:#5f9e82;
  --rose-100:#fdeef0;--rose-400:#ec8798;--rose-500:#dd6579;
}
.theme-dawn{--sky1:#d9ecff;--sky2:#e2e8fb;--sky3:#efe8f6;--sea-a:#a9c9ec;--sea-b:#6f97cf;--glow:rgba(255,214,140,.85);--star-op:.35}
.theme-dusk{--sky1:#f2dfee;--sky2:#e2daf4;--sky3:#d6d2f0;--sea-a:#b0a6de;--sea-b:#7d78c0;--glow:rgba(255,190,170,.9);--star-op:.55}
.theme-night{--sky1:#26345c;--sky2:#1c2747;--sky3:#16203a;--sea-a:#33517f;--sea-b:#1e3460;--glow:rgba(230,235,255,.85);--star-op:1}

/* ================= 基础 ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--ink);background:#e3e9f8;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea,input{font-family:inherit}
img,svg{display:block}
::selection{background:var(--sea-300);color:var(--ink-deep)}
:focus-visible{outline:2px solid var(--sea-500);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#e7edf8}::-webkit-scrollbar-thumb{background:#b6c9e6;border-radius:8px;border:2px solid #e7edf8}

.font-display{font-family:var(--font-display)}
.font-letter{font-family:var(--font-letter)}

/* ================= 动效 ================= */
@keyframes waveSlide{to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(3deg)}}
@keyframes miniBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(5deg)}}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.95;transform:scale(1.2)}}
@keyframes cloudDrift{from{transform:translateX(-22vw)}to{transform:translateX(118vw)}}
@keyframes gullDrift{from{transform:translateX(-12vw) translateY(0)}50%{transform:translateX(48vw) translateY(-18px)}to{transform:translateX(112vw) translateY(4px)}}
@keyframes sunPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes riseUp{0%{transform:translateY(70px) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:translateY(0) rotate(-2deg);opacity:1}}
@keyframes heartFloat{0%{transform:translateY(0) scale(.55);opacity:0}15%{opacity:1}100%{transform:translateY(-120px) scale(1.3);opacity:0}}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes spinSoft{to{transform:rotate(360deg)}}
@keyframes shimmerSweep{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes bubbleUp{0%{transform:translateY(0) scale(.55);opacity:0}25%{opacity:.75}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
.anim-wave{animation:waveSlide linear infinite}
.anim-bob{animation:bob 4.8s ease-in-out infinite}
.anim-mini-bob{animation:miniBob 3.8s ease-in-out infinite}
.anim-twinkle{animation:twinkle ease-in-out infinite}
.anim-cloud{animation:cloudDrift linear infinite}
.anim-gull{animation:gullDrift linear infinite}
.anim-sun{animation:sunPulse 5s ease-in-out infinite}
.anim-fade-up{animation:fadeUp .6s ease-out both}
.anim-modal-in{animation:modalIn .42s cubic-bezier(.2,.9,.3,1.15) both}
.anim-backdrop-in{animation:backdropIn .28s ease-out both}
.anim-shake{animation:shake .45s ease-in-out}
.anim-pop{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.anim-rise{animation:riseUp .9s cubic-bezier(.2,.8,.3,1.08) both}
.heart-float{animation:heartFloat 1.5s ease-out forwards}
.anim-pulse-ring{animation:pulseRing 2.2s ease-out infinite}
.anim-spin-soft{animation:spinSoft 1.1s linear infinite}
.anim-bubble{animation:bubbleUp 4.4s ease-in infinite}
.shimmer{background:linear-gradient(100deg,#f0e9d8 40%,#fdf9ee 50%,#f0e9d8 60%);background-size:200% 100%;animation:shimmerSweep 1.4s linear infinite}
.card-soft{box-shadow:0 2px 6px rgba(49,64,95,.05),0 14px 34px rgba(49,64,95,.1)}

/* ================= 图标 ================= */
.ic{display:inline-block;vertical-align:-.15em;width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.filled{fill:currentColor;stroke:none}
.ic-s{width:13px;height:13px}.ic-m{width:17px;height:17px}.ic-l{width:21px;height:21px}.ic-xl{width:26px;height:26px}

/* ================= 布局 / 导航 ================= */
#app{min-height:100vh}
.main{padding-bottom:120px}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px}
.wrap-wide{max-width:720px;margin:0 auto;padding:24px 16px}
.footer-note{max-width:640px;margin:0 auto;padding:32px 16px 0;text-align:center;font-size:11px;line-height:1.7;color:var(--ink-faint)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:80;border-top:1px solid #ded6c2;background:rgba(253,250,243,.95);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .inner{max-width:480px;margin:0 auto;display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:11px;font-weight:500;color:var(--ink-faint);transition:color .2s,transform .1s;position:relative}
.nav-btn:active{transform:scale(.95)}
.nav-btn.active{color:var(--sea-600)}
.nav-btn .icwrap{border-radius:999px;padding:4px 12px;transition:background .2s}
.nav-btn.active .icwrap{background:var(--sea-100)}
.nav-badge{position:absolute;right:22%;top:6px;min-width:16px;height:16px;border-radius:999px;background:var(--blush-400);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ================= 海洋场景 ================= */
.ocean{position:relative;overflow:hidden}
.stars{position:absolute;inset:0;opacity:var(--star-op)}
.star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.7)}
.sun{position:absolute;right:12%;top:12%;width:64px;height:64px;border-radius:50%}
@media(min-width:768px){.sun{width:80px;height:80px}}
.sun .crater{position:absolute;left:12px;top:16px;width:12px;height:12px;border-radius:50%;background:#aab8e0;opacity:.7}
.cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.7);filter:blur(6px)}
.gull{position:absolute;top:24%;width:40px;height:14px;color:var(--ink-soft)}
.bubble{position:absolute;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2)}
.wave{position:absolute;left:0;right:0;bottom:0}
.wave .track{display:flex;height:100%;width:200%}
.wave .track>span{height:100%;width:50%;flex:none}
.wave svg{height:100%;width:100%;flex:none}
.foam{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.15)}
.float-bottle{position:absolute;z-index:10;width:38px;cursor:pointer;transition:transform .2s;background:none}
.float-bottle:hover{transform:scale(1.1)}
@media(min-width:768px){.float-bottle{width:44px}}
.ocean-overlay{position:absolute;inset:0;z-index:20}

/* 首页覆盖层内容 */
.home-inner{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
@media(min-width:768px){.home-inner{padding:32px}}
.home-top{max-width:85%}
.home-eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;letter-spacing:.02em}
.home-title{font-family:var(--font-display);margin-top:8px;font-size:40px;line-height:1.15}
@media(min-width:768px){.home-title{font-size:52px}}
.home-slogan{font-family:var(--font-letter);margin-top:8px;font-size:16px}
@media(min-width:768px){.home-slogan{font-size:18px}}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{border-radius:999px;padding:6px 14px;font-size:12px;font-weight:500;backdrop-filter:blur(4px)}
.cta-row{display:flex;flex-direction:column;gap:12px}
@media(min-width:640px){.cta-row{flex-direction:row;align-items:flex-end;gap:16px}}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:16px 32px;font-size:18px;font-weight:500;color:#fff;transition:transform .2s,box-shadow .2s,background .2s}
.cta:hover{transform:translateY(-3px)}
.cta:active{transform:scale(.96)}
.cta-throw{background:var(--coral-400);box-shadow:0 14px 32px rgba(229,127,88,.5)}
.cta-throw:hover{background:var(--coral-500);box-shadow:0 18px 40px rgba(229,127,88,.6)}
.cta-catch{background:var(--sea-600);box-shadow:0 14px 32px rgba(61,101,158,.5)}
.cta-catch:hover{background:var(--sea-700);box-shadow:0 18px 40px rgba(61,101,158,.6)}
.cta .count{border-radius:999px;background:rgba(255,255,255,.25);padding:2px 8px;font-size:12px}

/* 首页海面之下卡片 */
.below{max-width:720px;margin:-20px auto 0;padding:0 16px 24px;display:flex;flex-direction:column;gap:16px}
.panel{border-radius:22px;padding:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:var(--font-display);font-size:16px;color:var(--ink-deep)}
.panel-sub{font-size:11px;color:var(--ink-faint)}
.panel p.body{margin-top:8px;font-size:13px;line-height:1.7;color:var(--ink)}
.quote-panel{position:relative;overflow:hidden;background:var(--dusk-100)}
.quote-mark{position:absolute;right:-24px;top:-32px;font-size:110px;line-height:1;color:rgba(201,188,232,.5);user-select:none;font-family:Georgia,serif}
.quote-text{font-family:var(--font-letter);font-size:18px;line-height:1.7;color:var(--ink-deep)}
.quote-by{margin-top:8px;font-size:11px;color:var(--ink-soft)}
.energy-card{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--cream);transition:transform .2s}
.energy-card:hover{transform:translateY(-2px)}
.energy-left{display:flex;align-items:center;gap:12px}
.energy-ico{width:40px;height:40px;border-radius:50%;background:var(--gold-100);color:var(--gold-500);display:flex;align-items:center;justify-content:center}
.energy-name{font-size:14px;font-weight:500;color:var(--ink-deep)}
.energy-sub{margin-top:2px;font-size:11px;color:var(--ink-soft)}

/* ================= 通用小组件 ================= */
.btn{border-radius:999px;padding:10px 22px;font-size:14px;font-weight:500;transition:background .2s,transform .1s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn-sea{background:var(--sea-600);color:#fff;box-shadow:0 6px 18px rgba(61,101,158,.35)}
.btn-sea:hover{background:var(--sea-700)}
.btn-coral{background:var(--coral-400);color:#fff;box-shadow:0 6px 18px rgba(229,127,88,.4)}
.btn-coral:hover{background:var(--coral-500)}
.btn-ghost{border:1px solid var(--sea-300);background:#fff;color:var(--sea-600)}
.btn-ghost:hover{background:var(--sea-50)}
.btn-ai{background:linear-gradient(90deg,var(--dusk-400),var(--blush-400));color:#fff;box-shadow:0 4px 14px rgba(169,150,214,.4);padding:7px 14px;font-size:12px}
.btn-ai:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.7;cursor:not-allowed}
.link-quiet{font-size:13px;color:var(--ink-soft);text-decoration:none}
.link-quiet:hover{text-decoration:underline}

.card{background:var(--cream);border-radius:26px;padding:20px}
.field-label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:8px}
.textarea{width:100%;resize:none;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.8);padding:12px 16px;font-size:15px;line-height:1.7;color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.textarea:focus{border-color:var(--sea-400);background:#fff}
.textarea::placeholder{color:#b8ad92}
.char-count{text-align:right;font-size:11px;color:var(--ink-faint);margin-top:4px}
.section-label{font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:8px}

/* 情绪标签 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:12px;transition:transform .1s,opacity .2s,box-shadow .2s}
.chip:active{transform:scale(.95)}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip.sel{box-shadow:0 0 0 2px var(--sea-400);opacity:1!important}
.chip-study{background:#eaf1fc;color:#46688f}
.chip-exam{background:#e5ecf8;color:#3d5e9e}
.chip-social{background:#efeafb;color:#665a9e}
.chip-family{background:#f9ecf2;color:#9a5f7c}
.chip-self{background:#e6f3ef;color:#3f7d6e}
.chip-other{background:#f0f2f5;color:#5c6a85}
/* 回复风格 chips */
.style-gentle{background:var(--blush-100);color:var(--blush-500)}
.style-encourage{background:var(--gold-100);color:var(--gold-500)}
.style-practical{background:var(--mint-100);color:var(--mint-500)}
.meta-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:11px}
.meta-chip .dot{width:6px;height:6px;border-radius:50%}

/* 开关 */
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:#d9d2c0;transition:background .2s;flex:none}
.switch.on{background:var(--sea-500)}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:left .2s}
.switch.on .knob{left:22px}
.switch-row{display:flex;align-items:center;justify-content:space-between;border-radius:16px;background:var(--sea-50);padding:12px 16px}
.switch-row .t{font-size:13px;font-weight:500;color:var(--ink-deep)}
.switch-row .d{margin-top:2px;font-size:11px;color:var(--ink-soft)}

/* 语气温度计 */
.meter{display:flex;align-items:center;gap:12px;margin-top:6px}
.meter .lbl{font-size:11px;color:var(--ink-soft);flex:none}
.meter .bar{height:8px;flex:1;border-radius:999px;background:var(--cream-deep);overflow:hidden}
.meter .fill{height:100%;border-radius:999px;transition:width .5s,background .5s}
.meter .val{width:150px;flex:none;text-align:right;font-size:11px;font-weight:500}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;border:1px dashed #d6cbb2;border-radius:22px;background:rgba(253,250,243,.7);padding:40px 24px}
.empty .ico{width:56px;height:56px;border-radius:50%;background:var(--sea-100);color:var(--sea-500);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.empty .t{font-family:var(--font-display);font-size:16px;color:var(--ink-deep)}
.empty .d{margin-top:6px;max-width:280px;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.empty .act{margin-top:16px}

/* ================= 弹层 ================= */
.overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:640px){.overlay{align-items:center;padding:24px}}
.overlay .bg{position:absolute;inset:0;background:rgba(28,42,74,.55);backdrop-filter:blur(3px);cursor:default;border:none}
.dialog{position:relative;width:100%;max-width:512px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;background:var(--cream);border-radius:28px 28px 0 0;box-shadow:0 24px 70px rgba(28,42,74,.4)}
.dialog.wide{max-width:672px}
@media(min-width:640px){.dialog{border-radius:28px}}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:16px 20px}
.dialog-head h3{font-family:var(--font-display);font-size:18px;color:var(--ink-deep)}
.dialog-head .sub{margin-top:2px;font-size:12px;color:var(--ink-soft)}
.icon-btn{border-radius:50%;background:var(--cream-deep);padding:8px;color:var(--ink-soft);transition:transform .2s,background .2s}
.icon-btn:hover{transform:rotate(90deg);background:var(--line)}
.dialog-body{overflow-y:auto;padding:20px}

/* 守门员 */
.care-overlay{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px}
.care-box{position:relative;width:100%;max-width:440px;border-radius:28px;border:1px solid;padding:24px;box-shadow:0 20px 60px rgba(15,25,50,.4)}
.care-hard{border-color:rgba(236,135,152,.4);background:#fff5f5}
.care-implicit{border-color:rgba(246,212,145,.6);background:#fff9ef}
.care-head{display:flex;align-items:flex-start;gap:12px}
.care-ico{width:44px;height:44px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.care-hard .care-ico{background:var(--rose-400)}
.care-implicit .care-ico{background:var(--gold-400)}
.care-title{font-family:var(--font-display);font-size:16px;color:var(--ink-deep)}
.care-body{margin-top:6px;font-size:13px;line-height:1.7;color:var(--ink)}
.care-tags{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.care-tags .lbl{font-size:11px;color:var(--ink-soft)}
.care-tag{border-radius:999px;padding:2px 8px;font-size:11px}
.care-hard .care-tag{background:var(--rose-100);color:var(--rose-500)}
.care-implicit .care-tag{background:var(--gold-100);color:var(--gold-500)}
.care-rewrite{margin-top:16px;border-radius:16px;border:1px solid rgba(246,212,145,.5);background:rgba(255,255,255,.8);padding:16px}
.care-rewrite .lbl{font-size:11px;font-weight:500;color:var(--gold-500)}
.care-rewrite p{margin-top:6px;font-size:13px;line-height:1.7;color:var(--ink)}

/* Toast */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{border-radius:999px;padding:10px 20px;font-size:14px;font-weight:500;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast-ok{background:var(--sea-600)}
.toast-warn{background:var(--gold-500)}
.toast-err{background:var(--coral-500)}

/* ================= 抛瓶 ================= */

/* 成功页 */
.done-wrap{max-width:560px;margin:0 auto;padding:40px 16px;text-align:center}

/* ================= 捞瓶 ================= */

.letter-card{position:relative;overflow:hidden;border-radius:26px;background:var(--cream)}

.letter-author{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:var(--ink-soft)}

.hug-btn{margin-top:16px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:8px 16px;font-size:12px;font-weight:500;color:var(--ink-soft);transition:transform .1s,border-color .2s,color .2s}
.hug-btn:hover{border-color:var(--blush-300);color:var(--blush-500)}
.hug-btn:active{transform:scale(.95)}
.hug-btn.on{border-color:var(--blush-400);background:var(--blush-100);color:var(--blush-500)}
.reply-box{margin-top:16px;border-radius:26px;background:var(--cream);padding:20px}
.reply-head{display:flex;align-items:center;justify-content:space-between}

.ai-cards{margin-top:12px;display:flex;flex-direction:column;gap:8px}

.ai-card:active{transform:scale(.99)}
.ai-card.sel{border-color:var(--sea-400);background:var(--sea-50)}

.reply-foot{margin-top:12px;display:flex;align-items:center;justify-content:flex-end;gap:8px}

/* 打捞中 */
.fetching{max-width:560px;margin:0 auto;padding:64px 16px;text-align:center}
.fetching .sea-window{position:relative;margin:0 auto;height:224px;width:160px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,var(--sea-300),var(--sea-500) 55%,var(--sea-700))}

/* ================= 我的空间 ================= */
.id-card{position:relative;overflow:hidden;border-radius:26px;background:var(--cream);padding:20px}

.reroll{border-radius:50%;background:var(--cream-deep);padding:6px;color:var(--ink-soft);transition:color .2s,transform .1s}
.reroll:hover{color:var(--sea-600)}
.reroll:active{transform:scale(.9)}
.id-sub{margin-top:2px;font-size:12px;color:var(--ink-soft)}
.id-tags{margin-top:8px;display:flex;align-items:center;gap:8px}
.tag-energy{display:flex;align-items:center;gap:4px;border-radius:999px;background:var(--gold-100);padding:4px 10px;font-size:11px;font-weight:500;color:var(--gold-500)}
.tag-week{display:flex;align-items:center;gap:4px;border-radius:999px;background:var(--dusk-100);padding:4px 10px;font-size:11px;font-weight:500;color:var(--dusk-500);transition:background .2s,transform .1s}

.tag-week:active{transform:scale(.95)}
.notice-card{margin-top:16px;border-radius:22px;border:1px solid var(--blush-300);background:rgba(252,238,242,.7);padding:16px}
.notice-head{display:flex;align-items:center;justify-content:space-between}
.notice-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--blush-500)}
.notice-dot{position:relative;width:10px;height:10px}
.notice-dot .p{position:absolute;inset:0;border-radius:50%;background:var(--blush-400)}
.notice-item{display:flex;width:100%;align-items:center;justify-content:space-between;border-radius:12px;background:rgba(255,255,255,.8);padding:8px 12px;text-align:left;font-size:12px;color:var(--ink);transition:background .2s;margin-top:6px}
.notice-item:hover{background:#fff}
.notice-item .t{font-size:10px;color:var(--ink-faint)}
.tabs{margin-top:20px;display:flex;gap:8px}
.tab{border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;transition:transform .1s,background .2s}
.tab:active{transform:scale(.95)}
.tab.on{background:var(--ink-deep);color:#fff;box-shadow:0 4px 12px rgba(34,48,78,.3)}
.tab.off{background:rgba(255,255,255,.7);color:var(--ink-soft)}
.tab.off:hover{background:#fff}
.tab-content{margin-top:16px}
.item-card{border-radius:20px;background:var(--cream);padding:16px;margin-bottom:10px}
.item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.item-meta .time{margin-left:auto;font-size:10px;color:var(--ink-faint)}
.item-content{font-family:var(--font-letter);margin-top:10px;font-size:15px;line-height:1.7;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-stats{margin-top:8px;font-size:11px;color:var(--ink-soft)}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
.badge-card{position:relative;border-radius:20px;padding:16px;text-align:center}
.badge-card.got{background:var(--cream)}
.badge-card.lock{background:rgba(238,234,224,.8)}
.badge-ico{margin:0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badge-card.got .badge-ico{background:linear-gradient(135deg,var(--gold-300),var(--coral-400));color:#fff;box-shadow:0 6px 16px rgba(224,166,63,.4)}
.badge-card.lock .badge-ico{background:#ddd7c8;color:#a8a192}
.badge-name{font-family:var(--font-display);margin-top:8px;font-size:13px}
.badge-card.got .badge-name{color:var(--ink-deep)}
.badge-card.lock .badge-name{color:var(--ink-faint)}
.badge-desc{margin-top:2px;font-size:10px;line-height:1.5;color:var(--ink-soft)}
.badge-medal{position:absolute;right:8px;top:8px;font-size:10px}
.shop-desc{font-size:11px;color:var(--ink-soft);margin-bottom:10px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:20px;background:var(--cream);padding:12px 16px;margin-bottom:8px}
.shop-name{font-size:13px;font-weight:500;color:var(--ink-deep)}
.shop-type{margin-left:8px;border-radius:999px;background:var(--sea-50);padding:2px 6px;font-size:10px;color:var(--sea-600)}
.shop-desc2{margin-top:2px;font-size:11px;color:var(--ink-soft)}
.shop-buy{display:flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--gold-300);background:var(--gold-100);padding:6px 14px;font-size:12px;font-weight:500;color:var(--gold-500);transition:background .2s,transform .1s;flex:none}
.shop-buy:hover{background:rgba(246,212,145,.4)}
.shop-buy:active{transform:scale(.95)}
.shop-equip{border-radius:999px;background:var(--sea-600);padding:6px 16px;font-size:12px;font-weight:500;color:#fff;transition:background .2s,transform .1s;flex:none}
.shop-equip:hover{background:var(--sea-700)}
.shop-equip:active{transform:scale(.95)}
.shop-using{border-radius:999px;background:var(--mint-100);padding:6px 12px;font-size:12px;font-weight:500;color:var(--mint-500);flex:none}

/* ================= 周报 ================= */
.week-poster{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(135deg,var(--sea-600),var(--sea-500) 50%,var(--dusk-400));padding:24px;color:#fff}
.week-emoji{position:absolute;right:16px;top:16px;font-size:36px;opacity:.3}
.week-pre{font-family:var(--font-letter);font-size:14px;opacity:.9}
.week-grid{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.week-grid{grid-template-columns:repeat(4,1fr)}}
.week-stat{border-radius:16px;background:rgba(255,255,255,.15);padding:12px;text-align:center;backdrop-filter:blur(4px)}
.week-stat .n{font-family:var(--font-display);font-size:24px;line-height:1}
.week-stat .l{margin-top:6px;font-size:10px;opacity:.85}
.week-moods{margin-top:20px}
.week-moods .t{font-size:11px;opacity:.85}
.mood-bar{margin-top:6px;display:flex;align-items:center;gap:8px}
.mood-bar .name{width:56px;flex:none;font-size:11px}
.mood-bar .track{height:10px;flex:1;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.mood-bar .fill{display:block;height:100%;border-radius:999px;background:var(--gold-300)}
.mood-bar .num{width:20px;text-align:right;font-size:11px}
.week-quote{margin-top:20px;border-radius:16px;background:rgba(255,255,255,.95);padding:16px;color:var(--ink)}
.week-quote .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--dusk-500)}
.week-quote p{font-family:var(--font-letter);margin-top:6px;font-size:15px;line-height:1.7}
.week-foot{margin-top:16px;text-align:center;font-size:10px;opacity:.75}
.loading-col{display:flex;flex-direction:column;align-items:center;gap:12px;padding:64px 24px}
.loading-col p{font-size:13px;color:var(--ink-soft)}

/* ================= 急救工具箱 ================= */
.fab{position:fixed;right:16px;bottom:88px;z-index:70;width:56px;height:56px;border-radius:50%;background:var(--coral-400);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(229,127,88,.5);transition:transform .2s,background .2s}
.fab:hover{transform:scale(1.05);background:var(--coral-500)}
.fab:active{transform:scale(.95)}
.fab .ring{position:absolute;inset:0;border-radius:50%;background:var(--coral-300)}
.breath-box{border-radius:22px;background:var(--sea-50);padding:20px;text-align:center}
.breath-title{font-family:var(--font-display);font-size:14px;color:var(--ink-deep)}
.breath-stage{position:relative;margin:16px auto 0;width:144px;height:144px;display:flex;align-items:center;justify-content:center}
.breath-halo{position:absolute;inset:0;border-radius:50%;background:rgba(205,227,248,.6)}
.breath-ball{position:absolute;inset:12px;border-radius:50%;background:linear-gradient(135deg,var(--sea-300),var(--sea-500));box-shadow:0 8px 26px rgba(79,127,192,.45)}
.breath-label{position:relative;z-index:1;text-align:center;color:#fff}
.breath-label .ph{display:block;font-family:var(--font-display);font-size:18px;line-height:1}
.breath-label .num{display:block;margin-top:4px;font-size:24px;font-weight:300}
.breath-sub{margin-top:8px;font-size:11px;color:var(--ink-soft)}
.breath-actions{margin-top:12px;display:flex;justify-content:center;gap:8px}
.noise-row{display:flex;gap:10px}
.noise-btn{flex:1;display:flex;flex-direction:column;align-items:flex-start;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.8);padding:12px 16px;text-align:left;transition:transform .1s,border-color .2s,background .2s}
.noise-btn:active{transform:scale(.96)}
.noise-btn.on{border-color:var(--sea-500);background:var(--sea-600);color:#fff;box-shadow:0 6px 16px rgba(61,101,158,.35)}
.noise-btn .n{font-size:14px;font-weight:500}
.noise-btn .d{margin-top:2px;font-size:11px;color:var(--ink-soft)}
.noise-btn.on .d{color:var(--sea-100)}
.noise-note{margin-top:6px;font-size:10px;color:var(--ink-faint)}
.tool-reason{border-radius:16px;border:1px solid var(--coral-300);background:var(--coral-100);padding:12px 16px;font-size:13px;line-height:1.6;color:#9c5230;margin-bottom:16px}
.tool-reason b{font-weight:500}
.hotline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px;border:1px solid var(--sea-200);background:rgba(255,255,255,.85);padding:12px 16px;text-decoration:none;transition:border-color .2s,box-shadow .2s}
.hotline:hover{border-color:var(--sea-400);box-shadow:0 6px 16px rgba(49,64,95,.12)}
.hotline .name{font-size:14px;font-weight:500;color:var(--ink-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hotline .desc{margin-top:2px;font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hotline .call{display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--sea-500);padding:6px 12px;font-size:12px;font-weight:500;color:#fff;flex:none;transition:background .2s}
.hotline:hover .call{background:var(--sea-600)}
.tool-tip{margin-top:8px;text-align:center;font-size:11px;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<div id="app"></div>
<!-- Supabase JS v2（UMD 全局版，挂载到 window.supabase） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script>
"use strict";
/* =====================================================================
   心灵漂流瓶 · 单文件版
   数据层以 localStorage 模拟四张表（users / bottles / replies / notices），
   每个函数都对应未来的 Supabase 调用，迁移时只需替换实现。
   ===================================================================== */
var _ = Vue;
var ref = _.ref, reactive = _.reactive, computed = _.computed, onMounted = _.onMounted, watch = _.watch, nextTick = _.nextTick;

/* ---------------- 常量 ---------------- */
var MOODS = {
  study:  { label: "学习压力", dot: "#6b8cc7", sea: ["#a3c2e8", "#6b8fbe"] },
  exam:   { label: "考试焦虑", dot: "#4f74b8", sea: ["#7fa3d4", "#47689f"] },
  social: { label: "人际关系", dot: "#9b8ad0", sea: ["#a8a6dd", "#7377b8"] },
  family: { label: "家庭烦恼", dot: "#d98ba6", sea: ["#b4a4d8", "#7e74b4"] },
  self:   { label: "自我怀疑", dot: "#63a695", sea: ["#8fc3c0", "#537f96"] },
  other:  { label: "其他",     dot: "#8fa0bd", sea: ["#a6c1e2", "#6d8fbe"] }
};
var MOOD_LIST = Object.keys(MOODS).map(function (k) { return [k, MOODS[k]]; });
var REPLY_STYLES = {
  gentle:    { label: "温柔陪伴", chip: "style-gentle" },
  encourage: { label: "鼓励支持", chip: "style-encourage" },
  practical: { label: "实用建议", chip: "style-practical" }
};
var STYLE_KEYS = ["gentle", "encourage", "practical"];

/* ---------------- 时间工具 ---------------- */
function nowIso() { return new Date().toISOString(); }
function timeAgo(iso) {
  var diff = Date.now() - new Date(iso).getTime();
  var m = Math.floor(diff / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  var h = Math.floor(m / 60);

    .select("*", { count: "exact", head: true });
  if (countError) throw new Error("统计瓶子数失败：" + countError.message);
  if (!count) return null;                          // 海里一个瓶子也没有

  // 第 2 步：在 [0, count-1] 里随机一个偏移
  var offset = Math.floor(Math.random() * count);

  // 第 3 步：range(offset, offset) 表示「从第 offset 行取到第 offset 行」，即只要这一条
  var { data, error } = await sb
    .from("bottles")
    .select("id, content, mood, wants_reply, created_at")
    .range(offset, offset)
    .maybeSingle();                                 // 0 条返回 null 而不报错
  if (error) throw new Error("捞瓶失败：" + error.message);
  return data;
}

/** 把云端行映射成本地瓶子结构，让现有 UI（信纸卡片、抱抱、回复）无需改动即可渲染 */
function cloudToLocal(row) {
  if (!row) return null;
  return {
    id: "cloud-" + row.id,
    authorId: "cloud-anon",
    content: row.content,
    mood: MOODS[row.mood] ? row.mood : "other",
    skin: "skin-default",
    hugs: 0,
    huggedBy: [],
    wantsReply: row.wants_reply !== false,
    target: "ocean",
    sealedUntil: null,
    openedNoticeSent: true,
    createdAt: row.created_at || nowIso()
  };
}

/** 启动时探测一次云端连通性，更新页脚的连接状态 */
async function cloudPing() {
  if (!sb) { store.cloudMode = "本地模式（未加载云端 SDK）"; return; }
  try {
    var { error } = await sb.from("bottles").select("id", { head: true, count: "exact" }).limit(1);
    if (error) throw error;
    store.cloudMode = "☁️ 云端已连接 · 瓶子实时同步";
  } catch (e) {
    store.cloudMode = "🐚 离线模式 · 仅本地存储";
  }
}

  } catch (e) { _cache = { users: [], bottles: [], replies: [], notices: [] }; }

      .then(function () { store.cloudMode = "☁️ 云端已连接 · 瓶子实时同步"; })

    function reroll() { dbRerollName(); toast("ok", "换了个新身份，海还是那片海"); bump(); }
    function markRead() { markAllRead(); bump(); }
    function badgeGot(bd) { return bd.earned(stats.value); }
    return {
      tab: tab, weekOpen: weekOpen, stats: stats, myBottles: myBottles, myReplies: myReplies, notices: notices, unread: unread,
      user: user, frameClass: frameClass, replyCount: replyCount, unlock: unlock, equip: equip, owned: owned, equipped: equipped,
      noticeText: noticeText, reroll: reroll, markRead: markRead, badgeGot: badgeGot,
      badges: BADGES, unlocks: UNLOCKS, moods: MOODS, energyTitle: energyTitle, isUnsealed: isUnsealed, countdownLabel: countdownLabel,
      timeAgo: timeAgo, glassBottleSvg: glassBottleSvg, miniBottleSvg: miniBottleSvg, ic: ic, go: go, isWarmReply: isWarmReply,
      openBottle: function (id) { ctx.emit("open-bottle", id); }
    };
  },
  template: '\
<div class="wrap-wide anim-fade-up">\
  <div class="id-card card-soft">\
    <span class="blob" aria-hidden="true"></span>\
    <div class="id-inner">\
      <div class="avatar" :class="frameClass" :style="{ background: user.avatarHue }">{{ user.nickname ? user.nickname.slice(0,1) : "" }}</div>\
      <div style="min-width:0;flex:1">\
        <div class="id-name"><h1>{{ user.nickname }}</h1><button class="reroll" aria-label="换一个匿名身份" @click="reroll" v-html="ic(\'refresh\', \'ic-s\')"></button></div>\
        <p class="id-sub">匿名身份 · {{ energyTitle(user.energy || 0) }} · 连续 {{ stats.streak }} 天看海</p>\
        <div class="id-tags">\
          <span class="tag-energy"><span v-html="ic(\'sparkle\', \'ic-s\')"></span>心灵能量 {{ user.energy }}</span>\
          <button class="tag-week" @click="weekOpen = true"><span v-html="ic(\'gift\', \'ic-s\')"></span>心灵周报</button>\
        </div>\
      </div>\
    </div>\
  </div>\
  <div v-if="unread > 0" class="notice-card card-soft">\
    <div class="notice-head">\
      <p class="notice-title"><span class="notice-dot"><span class="p anim-pulse-ring"></span><span class="p"></span></span>有 {{ unread }} 条新的回音</p>\
      <button class="link-quiet" style="font-size:11px" @click="markRead">全部已读</button>\
    </div>\
    <button v-for="n in notices.filter(function(x){return !x.read;}).slice(0,3)" :key="n.id" class="notice-item" @click="openBottle(n.bottleId)"><span>{{ noticeText(n.kind) }}</span><span class="t">{{ timeAgo(n.createdAt) }}</span></button>\
  </div>\
  <div class="tabs" role="tablist" aria-label="我的空间">\
    <button v-for="t in [{id:\'bottles\',label:\'我的瓶子 \' + myBottles.length},{id:\'replies\',label:\'我的回复 \' + myReplies.length},{id:\'growth\',label:\'成长与解锁\'}]" :key="t.id" role="tab" class="tab" :class="tab === t.id ? \'on\' : \'off\'" :aria-selected="tab === t.id" @click="tab = t.id">{{ t.label }}</button>\
  </div>\
  <div class="tab-content">\
    <template v-if="tab === \'bottles\'">\
      <div v-if="!myBottles.length" class="empty"><span class="ico"><span v-html="ic(\'bottle\', \'ic-xl\')"></span></span><p class="t">还没有抛出过瓶子</p><p class="d">把第一份心事交给海吧，也许某个晚上，它就会被人温柔地捞起。</p><span class="act"><button class="btn btn-coral" @click="go(\'throw\')">去抛一个瓶子</button></span></div>\
      <div v-else>\
        <div v-for="b in myBottles" :key="b.id" class="item-card card-soft">\
          <div class="item-meta">\
            <span v-html="miniBottleSvg(b.skin)" style="width:20px"></span>\
            <span class="meta-chip" :class="\'chip-\' + b.mood">{{ moods[b.mood].label }}</span>\
            <span v-if="!isUnsealed(b)" class="meta-chip" style="background:var(--dusk-100);color:var(--dusk-500)"><span v-html="ic(\'clock\', \'ic-s\')"></span>{{ countdownLabel(b.sealedUntil) }} · {{ b.target === \'self\' ? \'给未来的自己\' : \'时间胶囊\' }}</span>\
            <span v-if="b.wantsReply && replyCount(b) > 0 && isUnsealed(b)" class="meta-chip" style="background:var(--blush-100);color:var(--blush-500)">有 {{ replyCount(b) }} 封回信 💌</span>\
            <span class="time">{{ timeAgo(b.createdAt) }}</span>\
          </div>\
          <p class="item-content">{{ b.content }}</p>\
          <p class="item-stats">🤗 {{ b.hugs }} 个拥抱 · 💬 {{ replyCount(b) }} 条回复</p>\
        </div>\
      </div>\
    </template>\
    <template v-else-if="tab === \'replies\'">\
      <div v-if="!myReplies.length" class="empty"><span class="ico"><span v-html="ic(\'heartFilled\', \'ic-xl\')"></span></span><p class="t">还没有送出过温暖</p><p class="d">去捞一个瓶子，写下第一句安慰的话。被标记为「温暖回复」的话，会获得勋章进度哦。</p></div>\
      <div v-else>\
        <div v-for="r in myReplies" :key="r.id" class="item-card card-soft">\
          <div class="item-meta">\
            <span v-if="isWarmReply(r)" class="meta-chip" style="background:var(--gold-400);color:#fff"><span v-html="ic(\'star\', \'ic-s\')"></span>温暖回复</span>\
            <span class="meta-chip" style="background:var(--sea-50);color:var(--sea-600)">❤️ 被点亮 {{ r.likes }} 次</span>\
            <span class="time">{{ timeAgo(r.createdAt) }}</span>\
          </div>\
          <p style="margin-top:8px;font-size:14px;line-height:1.7;color:var(--ink)">{{ r.content }}</p>\
        </div>\
      </div>\
    </template>\
    <template v-else>\
      <div style="margin-bottom:20px">\
        <h2 class="font-display" style="font-size:16px;color:var(--ink-deep);margin-bottom:10px">心灵守护者勋章</h2>\
        <div class="badge-grid">\
          <div v-for="bd in badges" :key="bd.id" class="badge-card card-soft" :class="badgeGot(bd) ? \'got\' : \'lock\'">\
            <div class="badge-ico"><span v-html="ic(badgeGot(bd) ? bd.icon : \'lock\', \'ic-l\')"></span></div>\
            <p class="badge-name">{{ bd.name }}</p>\
            <p class="badge-desc">{{ bd.desc }}</p>\
            <span v-if="badgeGot(bd)" class="badge-medal">🏅</span>\
          </div>\
        </div>\
      </div>\
      <div>\
        <h2 class="font-display" style="font-size:16px;color:var(--ink-deep)">能量兑换所</h2>\
        <p class="shop-desc" style="margin-top:4px">每次抛瓶、捞瓶、回复、点赞都会积攒心灵能量，用来解锁瓶子皮肤、头像框和海面主题。</p>\
        <div v-for="u in unlocks" :key="u.id" class="shop-item card-soft">\
          <div style="min-width:0"><p class="shop-name">{{ u.name }}<span class="shop-type">{{ u.type === \'skin\' ? \'瓶子皮肤\' : u.type === \'frame\' ? \'头像框\' : \'海面主题\' }}</span></p><p class="shop-desc2">{{ u.desc }}</p></div>\
          <span v-if="equipped(u)" class="shop-using">使用中</span>\
          <button v-else-if="owned(u)" class="shop-equip" @click="equip(u.type, u.id)">穿上</button>\
          <button v-else class="shop-buy" @click="unlock(u.id, u.cost)"><span v-html="ic(\'sparkle\', \'ic-s\')"></span>{{ u.cost }} 能量</button>\
        </div>\
      </div>\
    </template>\
  </div>\
  <WeeklyModal v-if="weekOpen" @close="weekOpen = false" />\
</div>'
};

/* ---------------- 组件：心灵周报 ---------------- */
var WeeklyModal = {
  emits: ["close"],
  setup: function (props, ctx) {
    var ready = ref(false);
    var stats = weeklyStats();
    var quote = weeklyQuote(stats);
    var t = setTimeout(function () { ready.value = true; }, 1100);
    var moodEntries = MOOD_LIST.filter(function (m) { return (stats.moodCounts[m[0]] || 0) > 0; });
    var maxCount = Math.max.apply(null, [1].concat(moodEntries.map(function (m) { return stats.moodCounts[m[0]] || 0; })));
    onMounted(function () {
      var onKey = function (e) { if (e.key === "Escape") ctx.emit("close"); };
      window.addEventListener("keydown", onKey); window._weekKey = onKey;
    });
    return { ready: ready, stats: stats, quote: quote, moodEntries: moodEntries, maxCount: maxCount, moods: MOODS, fmtDate: fmtDate, nowIso: nowIso, ic: ic, spinner: spinner,
      barWidth: function (id) { return ((stats.moodCounts[id] || 0) / maxCount) * 100 + "%"; } };
  },
  unmounted: function () { if (window._weekKey) { window.removeEventListener("keydown", window._weekKey); window._weekKey = null; } },
  template: '\
<div class="overlay">\
  <button class="bg anim-backdrop-in" aria-label="关闭" @click="$emit(\'close\')"></button>\
  <div class="dialog wide anim-modal-in" role="dialog" aria-modal="true" aria-label="每周心灵周报">\
    <div class="dialog-head"><div><h3>每周心灵周报</h3><p class="sub">回顾 · {{ fmtDate(nowIso()) }} 这一周</p></div><button class="icon-btn" aria-label="关闭" @click="$emit(\'close\')" v-html="ic(\'close\')"></button></div>\
    <div v-if="!ready" class="loading-col"><span v-html="spinner(\'ic-xl\')" style="color:var(--sea-500)"></span><p>正在把这一周的心事折成信纸…</p></div>\
    <div v-else class="dialog-body">\
      <div class="week-poster anim-fade-up">\
        <span class="week-emoji" aria-hidden="true">🌊</span>\
        <p class="week-pre">这一周的你 ——</p>\
        <div class="week-grid">\
          <div v-for="s in [{n:stats.thrown,label:\'抛出的瓶子\'},{n:stats.replied,label:\'送出的回复\'},{n:stats.warmLabels,label:\'温暖回复标签\'},{n:stats.likesGiven,label:\'点亮的温暖\'}]" :key="s.label" class="week-stat"><p class="n">{{ s.n }}</p><p class="l">{{ s.label }}</p></div>\
        </div>\
        <div v-if="moodEntries.length" class="week-moods">\
          <p class="t">情绪标签的足迹</p>\
          <div v-for="m in moodEntries" :key="m[0]" class="mood-bar"><span class="name">{{ m[1].label }}</span><span class="track"><span class="fill" :style="{ width: barWidth(m[0]) }"></span></span><span class="num">{{ stats.moodCounts[m[0]] || 0 }}</span></div>\
        </div>\
        <div class="week-quote"><p class="lbl"><span v-html="ic(\'sparkle\', \'ic-s\')"></span>AI 为你写的一句话</p><p>{{ quote }}</p></div>\
        <p class="week-foot">心灵漂流瓶 · 给正在变好的你 · 活跃 {{ stats.daysActive }} 天</p>\
      </div>\
    </div>\
  </div>\
</div>'
};

/* ---------------- 根应用 ---------------- */
var App = {
  components: { HomeView: HomeView, ThrowView: ThrowView, CatchView: CatchView, SpaceView: SpaceView, ToolboxModal: ToolboxModal },
  setup: function () {
    store.user = Object.assign({}, dbBoot());
    store.unread = unreadCount();
    cloudPing();   // ☁️ 启动时探测 Supabase 连通性，更新页脚连接状态
    var NAV = [ { id: "home", label: "首页", icon: "home" }, { id: "throw", label: "抛瓶", icon: "plus" }, { id: "catch", label: "捞瓶", icon: "bottle" }, { id: "space", label: "我的", icon: "user" } ];
    var themeClass = computed(function () { return "theme-" + (store.user ? store.user.theme : "dawn"); });
    var bgStyle = computed(function () { return { background: "linear-gradient(180deg, var(--sky3) 0%, #ebe6d8 360px, #ebe6d8 100%)" }; });
    function closeToolbox() { store.toolboxOpen = false; store.toolboxReason = null; }
    return { store: store, NAV: NAV, themeClass: themeClass, bgStyle: bgStyle, go: go, openBottleById: openBottleById, openToolbox: openToolbox, closeToolbox: closeToolbox, ic: ic };
  },
  template: '\
<div :class="themeClass" :style="bgStyle" style="min-height:100vh">\
  <main class="main">\
    <HomeView v-if="store.view === \'home\'" />\
    <ThrowView v-else-if="store.view === \'throw\'" @open-toolbox="openToolbox" />\
    <CatchView v-else-if="store.view === \'catch\'" :key="store.catchKey" :initial-bottle-id="store.catchInitial" @open-toolbox="openToolbox" />\
    <SpaceView v-else-if="store.view === \'space\'" @open-bottle="openBottleById" />\
    <footer class="footer-note">心灵漂流瓶 · 匿名同伴互助演示版<br/>{{ store.cloudMode }}<br/>抛瓶写入云端 bottles 表 · 捞瓶从云端随机读取 · 断网自动回退本地<br/>若你或身边的人正处于危机中，请拨打 12355 或当地心理援助热线</footer>\
  </main>\
  <button class="fab" aria-label="打开急救工具箱：呼吸引导、白噪音与心理热线" @click="openToolbox()"><span class="ring anim-pulse-ring" aria-hidden="true"></span><span style="position:relative" v-html="ic(\'wind\', \'ic-xl\')"></span></button>\
  <nav class="bottomnav" aria-label="主导航">\
    <div class="inner">\
      <button v-for="n in NAV" :key="n.id" class="nav-btn" :class="{ active: store.view === n.id }" :aria-current="store.view === n.id ? \'page\' : undefined" @click="go(n.id)">\
        <span class="icwrap" v-html="ic(n.icon, \'ic-l\')"></span>{{ n.label }}\
        <span v-if="n.id === \'space\' && store.unread > 0" class="nav-badge">{{ store.unread }}</span>\
      </button>\
    </div>\
  </nav>\
  <ToolboxModal v-if="store.toolboxOpen" :reason="store.toolboxReason" @close="closeToolbox" />\
  <div class="toasts" aria-live="polite"><div v-for="t in store.toasts" :key="t.id" class="toast anim-pop" :class="\'toast-\' + t.type">{{ t.msg }}</div></div>\
</div>'
};

var _app = _.createApp(App);
_app.component("WeeklyModal", WeeklyModal);
_app.mount("#app");
</script>
</body>
</html>
