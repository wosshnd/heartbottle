<!-- 安全改动：将前端提交改为调用 Edge Function（/functions/v1/insert_bottle）以统一后端审核与权限控制 -->
<script>
// submit to Edge Function instead of clients writing directly to DB
async function submitBottleViaFunction({ content, mood, moodColor, isAnonymous }) {
  const text = (content || '').trim();
  if (text.length < 3) throw new Error('内容太短（至少 3 字）');
  if (text.length > 2000) throw new Error('内容过长（最多 2000 字）');

  // local semantic check (fast): block obvious insults early
  try {
    var localHits = checkSensitiveWords ? checkSensitiveWords(text) : [];
    if (localHits && localHits.length) {
      throw new Error('内容包含不当用语，请修改后再试');
    }
  } catch (e) {
    // ignore if function not present
  }

  // get access token from your auth layer (adjust to your app)
  const accessToken = window.session?.access_token || window.localStorage.getItem('hb_access_token') || '';

  const res = await fetch('/functions/v1/insert_bottle', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(accessToken ? { 'Authorization': 'Bearer ' + accessToken } : {})
    },
    body: JSON.stringify({ content: text, mood: mood || null, moodColor: moodColor || null, isAnonymous: !!isAnonymous })
  });

  if (res.status === 201 || res.status === 200) {
    return await res.json();
  }

  // parse error
  let errText = '提交失败';
  try { const j = await res.json(); errText = j?.error || j?.message || errText; } catch (e) {}
  throw new Error(errText);
}

// Bind to existing form if present
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('bottleForm');
  if (!form) return;
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    try {
      if (btn) btn.disabled = true;
      const content = (form.querySelector('#bottleContent')?.value) || '';
      const mood = (form.querySelector('[name="mood"]')?.value) || null;
      const moodColor = (form.querySelector('[name="moodColor"]')?.value) || null;
      const isAnonymous = !!(form.querySelector('#isAnonymous')?.checked);
      const result = await submitBottleViaFunction({ content, mood, moodColor, isAnonymous });
      // show success (customize)
      alert('抛瓶成功，谢谢你的分享！');
      form.reset();
    } catch (err) {
      alert('提交出错：' + (err?.message || err));
    } finally {
      if (btn) btn.disabled = false;
    }
  });
});
</script>
