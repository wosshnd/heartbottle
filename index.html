/* ------------------------------- AI 层 ------------------------------- */

/** 在这里填入你的 API Key 与接口地址即可接入真实大模型 */
const AI_CONFIG = {
  apiKey: "", // ← 例如 "sk-xxxx"，留空则走本地模拟

const SYSTEM_PROMPT = `你是一位温暖、共情力强的心理支持伙伴。
原则：倾听大于评价；接纳大于说服；鼓励具体行为而非空洞安慰。
禁忌：严禁说"这没什么大不了"、"你想多了"、"你应该..."。
对象：对方很可能是一名高中生。请以平等、温和的同龄挚友或知心学长学姐的口吻表达，贴近校园生活（考试、排名、同伴关系、家庭期待、青春期的心事），避免说教与空泛大道理。
输出格式：返回 JSON 对象，包含 empathy_response（共情回应）和 gentle_suggestion（温和建议）两个字段。`;

const MODERATION_PROMPT = `你是「心灵漂流瓶」同伴互助社区的内容安全审核员（面向高中生群体）。
请判断用户准备发送的回复是否存在「隐性攻击 / 微霸凌」，包括：
1. 否定感受（如"你想太多了""别矫情""没什么大不了"）
2. 贴标签（如"玻璃心""戏精""怪胎"）
3. 比较打击（如"别人都没事，就你事多""这点压力都承受不了？"）
4. 反问嘲讽（如"难道只有你觉得难受？"）
判断标准：是否会让一个情绪低落的高中生感到被否定、被嘲笑或被排挤。

async function getAiSuggestion(userText) {
  if (AI_CONFIG.apiKey) {
    try {
      const res = await fetch(AI_CONFIG.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${AI_CONFIG.apiKey}` },
        body: JSON.stringify({
          model: AI_CONFIG.model,
          response_format: { type: "json_object" },

            { role: "user", content: `对方的烦恼是：${userText}` },

          temperature: 0.8,
        }),

const CRISIS_KEYWORDS = ["不想活了", "不想活", "活着没意思", "活着没有意义", "结束生命", "了结生命", "结束自己", "了断", "轻生", "自杀", "自残", "割腕", "割手", "跳楼", "跳下去", "跳河", "吞药", "安眠药", "想死", "去死", "死了算了", "死了一了百了", "一了百了", "消失在这个世界", "从世界上消失", "离开这个世界", "解脱", "活不下去", "撑不下去", "没有明天", "这个世界不需要我", "没人需要我", "多余的人", "自伤"];

function checkRisk(text) {
  const matched = [];
  const push = (w) => { if (!matched.includes(w)) matched.push(w); };
  for (const w of HARD_ATTACK_WORDS) if (text.includes(w)) push(w);
  for (const p of HARD_ATTACK_PHRASES) if (text.includes(p)) push(p);
  if (matched.length) return { level: "hard", matched };
  for (const w of CRISIS_KEYWORDS) {
    if (w === "解脱") {
      const i = text.indexOf("解脱");
      if (i >= 0 && !/(释放|放松|缓解|喘口气)/.test(text.slice(Math.max(0, i - 6), i))) push(w);
    } else if (text.includes(w)) push(w);
  }
  if (matched.length) return { level: "crisis", matched };
  for (const re of IMPLICIT_ATTACK_PATTERNS) {
    const m = re.exec(text);
    if (m) push(m[0]);
  }
  if (matched.length) return { level: "implicit", matched };
  return { level: "safe", matched };
}

/** 加权随机：回复越少的瓶子，越容易被捞起 */
function pickWeightedBottle(bottles) {
  if (!bottles.length) return null;
  const weights = bottles.map((b) => 1 / (b.replies.length + 1));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < bottles.length; i++) {
    r -= weights[i];
    if (r <= 0) return bottles[i];
  }
  return bottles[bottles.length - 1];
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return `${m} 分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} 小时前`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} 天前`;
  const date = new Date(ts);
  return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
}

function computeWarmth(bottles) {
  const todayStart = new Date();
  todayStart.setHours(0, 0, 0, 0);
  const t0 = todayStart.getTime();
  const todayBottles = bottles.filter((b) => b.timestamp >= t0);
  const todayReplies = bottles.reduce((n, b) => n + b.replies.filter((r) => r.timestamp >= t0).length, 0);
  const todayLikes = bottles.reduce((n, b) => {
    const own = b.timestamp >= t0 ? b.likes : 0;
    return n + own + b.replies.reduce((m, r) => m + (r.timestamp >= t0 ? r.likes : 0), 0);
  }, 0);
  let gentle = 0, rough = 0;
  for (const b of bottles) {
    for (const r of b.replies) (checkRisk(r.content).level === "safe" ? gentle++ : rough++);
  }
  const ratio = gentle + rough === 0 ? 1 : gentle / (gentle + rough);
  const index = Math.min(100, Math.round((todayBottles.length * 3 + todayReplies * 5 + todayLikes * 2) * 4 * (0.5 + 0.5 * ratio)));
  const label = index >= 75 ? "阳光满格" : index >= 50 ? "暖流涌动" : index >= 25 ? "微风拂面" : index > 0 ? "晨光微露" : "等待第一份温暖";
  return { index, label, todayBottles: todayBottles.length, todayReplies, todayLikes };
}

function ThrowModal({ open, onClose, onSend }) {
  const [text, setText] = useState("");
  const [moodId, setMoodId] = useState(null);
  const [shake, setShake] = useState(false);
  const [care, setCare] = useState(null);
  const [reviewing, setReviewing] = useState(false);

  useEffect(() => {
    if (!open) { setCare(null); setReviewing(false); }
  }, [open]);

  if (!open) return null;

  const doSend = () => {
    onSend(text.trim(), moodId || undefined);
    setText("");
    setMoodId(null);
  };

  const submit = async () => {
    const t = text.trim();
    if (t.length < 2) { setShake(true); setTimeout(() => setShake(false), 500); return; }
    const risk = checkRisk(t);
    if (risk.level === "crisis") { setCare({ tone: "crisis", matched: risk.matched }); return; }
    if (risk.level === "hard") { setCare({ tone: "hard", matched: risk.matched }); return; }
    if (risk.level === "implicit") {
      if (AI_CONFIG.apiKey) {
        setReviewing(true);
        const r = await aiModeration(t);
        setReviewing(false);
        if (r.risky) { setCare({ tone: "implicit", matched: risk.matched }); return; }
      } else {
        setCare({ tone: "implicit", matched: risk.matched });
        return;
      }
    }
    doSend();
  };

  return (
    <>
      <ModalShell onClose={onClose}>
        <ModalHeader title="写下心事，抛进海里" sub="匿名投放 · 会被某位温柔的人捞起" onClose={onClose} />
        <div className="modal-body">
          <div className={"field" + (shake ? " anim-shake" : "")}>
            <textarea
              value={text}
              onChange={(e) => setText(e.target.value.slice(0, 200))}
              placeholder="把烦恼、心事、委屈写在这里……海会替你保管。"
              rows={5}
            />
            <span className="field-count">{text.length}/200</span>
          </div>

          <div>
            <p style={{ marginBottom: 8, fontSize: 12, color: "var(--color-ink-soft)" }}>此刻的心情（可选）</p>
            <div className="mood-row">
              {MOODS.map((m) => (
                <button key={m.id} onClick={() => setMoodId(moodId === m.id ? null : m.id)} className={"mood-chip " + m.bg + (moodId === m.id ? " on" : "")}>
                  <span className={"mood-dot " + m.dot} />
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          <p className="note-shield">
            <IconShield />
            发送前会经过温暖检测：攻击性语言会被拦截，危机信号会得到专业的关怀与帮助。
          </p>

          <button onClick={submit} disabled={reviewing} className="btn btn-throw">
            {reviewing ? (<><Spinner /> AI 正在审核语气…</>) : (
              <>
                <GlassBottle className="mini-bottle" withPaper />
                匿名抛进大海
              </>
            )}
          </button>
        </div>
      </ModalShell>

      {care && (
        <CareAlert
          care={care}
          onClose={() => setCare(null)}
          secondaryLabel={care.tone === "crisis" ? "我没事，仍要送出" : undefined}
          onSecondary={care.tone === "crisis" ? () => { setCare(null); doSend(); } : undefined}
        />
      )}
    </>
  );
}

  const currentRisk = current ? checkRisk(current.content) : null;
  const isCrisis = currentRisk && currentRisk.level === "crisis";

    if (!open) return;
    setCare(null);
    setHearts({});
    setSentCaring(new Set());
    setReply("");
    if (bottles.length === 0) {
      setCurrentId(null);
      setPhase("empty");
      return;
    }
    const picked = pickWeightedBottle(bottles);
    setCurrentId(picked ? picked.id : null);
    setPhase("rising");
    const t = window.setTimeout(() => setPhase("letter"), 1150);
    return () => window.clearTimeout(t);
  }, [open]);

  useEffect(() => () => { if (aiTypeRef.current) window.clearInterval(aiTypeRef.current); }, []);

  if (!open) return null;

  const sendReply = async (content, caring = false) => {
    const t = content.trim();
    if (!current) return;
    if (!caring) {
      if (t.length < 2) { setShake(true); setTimeout(() => setShake(false), 500); return; }
      const risk = checkRisk(t);
      if (risk.level === "crisis") { setCare({ tone: "crisis", matched: risk.matched }); return; }
      if (risk.level === "hard") { setCare({ tone: "hard", matched: risk.matched }); return; }
      if (risk.level === "implicit") {

          setReviewing(true);
          const r = await aiModeration(t);
          setReviewing(false);
          if (r.risky) { setCare({ tone: "implicit", matched: risk.matched }); return; }
        } else {
          setCare({ tone: "implicit", matched: risk.matched });
          return;
        }
      }
    }
    onSendReply(current.id, t, caring);
    setReply("");

    if (aiTypeRef.current) window.clearInterval(aiTypeRef.current);

      if (i >= full.length) {

        setAiLoading(false);

      id: Date.now() + k + Math.floor(Math.random() * 999),
      x: Math.random() * 44 - 22,

                  <div className="reply-actions">

                  </div>

              {sortedReplies.length > 0 && (
                <div>
                  <p className="replies-title"><IconHeartFilled />{sortedReplies.length} 条温暖回复 · 按点赞数从高到低</p>
                  <div className="replies-list">
                    {sortedReplies.map((r) => (
                      <div key={r.id} className="reply-item">
                        <p className="reply-text">{r.content}</p>
                        <div className="reply-foot">
                          <div className="reply-meta">
                            <b>匿名温暖的人</b>
                            {r.caring && <span className="caring-tag">关怀寄语</span>}
                            <span>{timeAgo(r.timestamp)}</span>
                          </div>
                          <div className="like-wrap">
                            {(hearts[r.id] || []).map((h) => (
                              <svg key={h.id} viewBox="0 0 24 24" className="mini-heart heart-float"
                                style={{ marginLeft: h.x, width: h.size, animationDelay: `${h.delay}s`, color: h.hue === "rose" ? "var(--color-blush-400)" : "var(--color-warm-400)" }}>
                                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8Z" fill="currentColor" />
                              </svg>
                            ))}
                            <button onClick={() => like(r.id)} className={"btn-like" + (r.likedByMe ? " liked" : "")}>
                              {r.likedByMe ? <IconHeartFilled /> : <IconHeart />}
                              感到温暖 · {r.likes}
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {!isCrisis && (
                <div className="again-row">
                  <button onClick={again} className="btn btn-ghost"><IconWaves />再捞一个</button>
                </div>
              )}
            </div>
          </>
        )}
      </ModalShell>

      {care && <CareAlert care={care} onClose={() => setCare(null)} />}
    </>
  );
}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver(
      (entries) => {
        for (const e of entries) {
          if (e.isIntersecting) { e.target.classList.add("revealed"); io.unobserve(e.target); }
        }
      },
      { threshold: 0.15 }
    );
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useCountUp(target, dur = 1000) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf;
    const t0 = performance.now();
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      setVal(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, dur]);
  return val;
}

function Seagull({ dur = 26, delay = 0, top = "14%" }) {
  return (
    <div className="seagull" style={{ position: "absolute", top, left: 0, animationDuration: `${dur}s`, animationDelay: `${delay}s`, opacity: 0.55 }} aria-hidden="true">
      <svg width="34" viewBox="0 0 34 12" fill="none" stroke="#5b709e" strokeWidth="2" strokeLinecap="round">
        <path d="M2 8 Q8 2 16 7 Q24 2 32 8" />
      </svg>
    </div>
  );
}

  useEffect(() => { saveBottles(bottles); }, [bottles]);
  useEffect(() => { saveStats(stats); }, [stats]);
  useReveal();

  useEffect(() => {
    if (throwAnim !== "splash") return;
    const t = setTimeout(() => setThrowAnim("idle"), 1000);
    return () => clearTimeout(t);
  }, [throwAnim]);

  const warmth = computeWarmth(bottles);
  const ringVal = useCountUp(warmth.index, 1300);

  const showToast = (kind, text) => {
    setToast({ kind, text, id: Date.now() });

    toastTimer.current = setTimeout(() => setToast(null), 2600);

  const floatHearts = (n) => {
    const batch = Array.from({ length: n }, (_, i) => ({
      id: `${Date.now()}-${i}-${Math.floor(Math.random() * 1e5)}`,
      left: 8 + Math.random() * 84,
      hue: Math.random() > 0.45 ? "rose" : "warm",

      setHearts((h) => h.filter((x) => !batch.some((b) => b.id === x.id)));
    }, 2100);
  };

  const sendBottle = (content, mood) => {
    const b = { id: uid(), content, timestamp: Date.now(), likes: 0, mood: mood || undefined, replies: [] };
    setBottles((prev) => [...prev, b]);
    setStats((s) => ({ ...s, sent: s.sent + 1 }));
    setModal(null);
    setThrowAnim("flying");
    showToast("success", "漂流瓶已出发，正随海浪漂向珍惜它的人");
  };

  const sendReply = (bottleId, content, caring = false) => {
    const r = { id: uid(), content, timestamp: Date.now(), likes: 0, likedByMe: false, caring };
    setBottles((prev) => prev.map((b) => (b.id === bottleId ? { ...b, replies: [...b.replies, r] } : b)));
    setStats((s) => ({ ...s, replies: s.replies + 1 }));
    showToast("success", caring ? "关怀寄语已温柔送达" : "温暖已随海浪送达");
  };

  const likeReply = (bottleId, replyId) => {
    let likedNow = false;
    setBottles((prev) =>
      prev.map((b) =>
        b.id !== bottleId
          ? b
          : {
              ...b,
              replies: b.replies.map((r) => {
                if (r.id !== replyId) return r;
                if (r.likedByMe) return r;
                likedNow = true;
                return { ...r, likes: r.likes + 1, likedByMe: true };
              }),
            }
      )
    );
    if (likedNow) {

    }

    let huggedNow = false;

      prev.map((b) => {
        if (b.id !== bottleId) return b;
        if (b.huggedByMe) return b;
        huggedNow = true;
        return { ...b, likes: b.likes + 1, huggedByMe: true };

          <div className="glow glow-lav" />

          <Cloud className="" opacity={0.7} dur={130} delay={-60} scale={0.8} />

            <h1 className="title-main anim-fade-up" style={{ animationDelay: "0.08s" }}>
              把心事装进瓶子，<br className="sm-only" />

            <svg className="title-wave" viewBox="0 0 220 14" fill="none" aria-hidden="true">

              <circle cx="214" cy="6" r="3" fill="#fbb98a" />

              <IconHeartFilled style={{ height: 12, width: 12 }} />
              已有 {stats.sent} 份心事被大海保管

          </div>

          {/* 海面 + 玻璃瓶 */}

            <div className="waves-wrap" aria-hidden="true"><Waves /></div>

            </div>

            {/* 漂浮小瓶：与真实数据联动 */}
            {driftBottles.map((b, i) => {
              const slot = DRIFT_SLOTS[i % DRIFT_SLOTS.length];

                <button

                  className="drifter"

                  aria-label="捞起这个漂流瓶"
                >

                  <span className="anim-mini-bob" style={{ display: "inline-block", animationDelay: `${i * 0.5}s` }}>
                    <MiniBottle paper={slot.paper} />

            {/* 主玻璃瓶 */}

              {throwAnim === "splash" && (

                  <Splash />

              )}
              <button
                className="hero-bottle"

                aria-label="点击捞起一个漂流瓶"
              >
                <div className="hero-bottle-inner" onAnimationEnd={(e) => { if (throwAnim === "flying" && e.animationName === "throwArc") setThrowAnim("splash"); }}>
                  <GlassBottle className={"hero-bottle-svg " + (throwAnim === "flying" ? "anim-throw" : "anim-bob")} withPaper />
                </div>
                <div className={"bottle-shadow" + (throwAnim === "idle" ? " anim-shadow" : "")} />
                <span className={"bottle-hint" + (throwAnim === "idle" ? " anim-hint" : "")}>
                  {throwAnim === "idle" ? "点我捞一个漂流瓶 ↑" : "…"}
                </span>
              </button>
            </div>
          </div>

          {/* 双按钮 */}
          <div className="actions anim-fade-up" style={{ animationDelay: "0.3s" }}>
            <button className="action-btn action-throw" onClick={() => setModal("throw")}>
              <span className="action-title"><IconSend />抛瓶子</span>
              <span className="action-sub">写下烦恼 · 匿名交给海</span>
            </button>
            <button className="action-btn action-pick" onClick={openPick}>
              <span className="action-title"><IconWaves />捞瓶子</span>
              <span className="action-sub">{bottles.length ? `海里有 ${bottles.length} 个瓶子` : "海面还空着，先去抛一个吧"}</span>
            </button>
          </div>
        </div>
      </div>

      {/* ---------------- 今日海况 ---------------- */}
      <section className="sea-report">
        <div className="report-card reveal">
          <div className="report-grid">
            <div className="report-left">
              <div className="ring-wrap">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                  <defs>
                    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stopColor="#fbb98a" />
                      <stop offset="100%" stopColor="#7fa9e2" />
                    </linearGradient>
                  </defs>
                  <circle className="ring-track" cx="50" cy="50" r="44" />
                  <circle
                    className="ring-value"
                    cx="50" cy="50" r="44"
                    strokeDasharray={C}
                    strokeDashoffset={C * (1 - (warmOpen ? warmth.index : 0) / 100)}
                  />
                </svg>
                <div className="ring-center">
                  <span className="ring-num">{ringVal}</span>
                  <span className="ring-label">今日温暖指数</span>
                </div>
              </div>
              <p className="warmth-desc">今日海况 · {warmth.label}</p>
              <div className="warmth-facts">
                <span className="fact-chip fact-a"><IconSend />今日心事 ×{warmth.todayBottles}</span>
                <span className="fact-chip fact-b"><IconWaves />今日回复 ×{warmth.todayReplies}</span>
                <span className="fact-chip fact-c"><IconHeartFilled />今日点亮 ×{warmth.todayLikes}</span>
              </div>
            </div>

            <div className="report-right">
              <h2 className="badges-title">海风勋章墙</h2>
              <p className="badges-sub">每一次温柔，都会被大海记住 · 已点亮 {unlocked.length}/{BADGES.length}</p>
              <div className="badge-grid">
                {BADGES.map((bd) => {
                  const on = bd.check(stats);
                  const Icon = BADGE_ICONS[bd.icon];

                    <div key={bd.id} className="badge" title={bd.desc}>
                      <div className={"badge-circle " + (on ? "on-" + bd.tint : "off")}>
                        {on ? <Icon /> : <IconLock />}
                      </div>
                      <span className={"badge-name " + (on ? "on" : "off")}>{bd.name}</span>
                      {on ? <span className="badge-hint">{bd.desc}</span> : (
                        <span className="badge-locknote"><IconLock />未解锁</span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* 页脚 */}
      <footer className="footer">
        <p>
          心灵漂流瓶 · 数据保存在你的浏览器（LocalStorage），刷新不会丢
          <br />
          <b>在这里，你的情绪被温柔接住。</b>若情绪持续低落，请记得向身边的人或专业热线求助。
        </p>
      </footer>

      {/* Toast */}
      {toast && (
        <div key={toast.id} className="toast anim-pop">
          {toast.kind === "success" ? (
            <IconHeartFilled className="toast-ok" />
          ) : toast.kind === "error" ? (
            <IconShield className="toast-err" />
          ) : (
            <IconWaves className="toast-ok" />
          )}
          {toast.text}
        </div>
      )}

      {/* 弹层 */}
      {modal === "throw" && <ThrowModal open onClose={() => setModal(null)} onSend={sendBottle} />}
      {modal === "pick" && (
        <PickModal
          open
          bottles={bottles}
          onClose={() => setModal(null)}
          onSendReply={sendReply}
          onLikeReply={likeReply}
          onHug={hugBottle}
          onSwitchToThrow={() => setModal("throw")}
        />
      )}

      {/* 滚动提示 */}
      <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", zIndex: 20, pointerEvents: "none" }} className="anim-hint" aria-hidden="true">
        <IconChevronDown style={{ height: 18, width: 18, color: "#a5aecb" }} />
      </div>

      {/* 温暖指数环的滚动触发 */}
      <WarmthTrigger onChange={setWarmOpen} />
    </div>
  );
}

function WarmthTrigger({ onChange }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = document.querySelector(".ring-wrap");
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting) { onChange(true); io.disconnect(); }
      },
      { threshold: 0.4 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [onChange]);
  return <span ref={ref} style={{ display: "none" }} />;
}

/* ------------------------------ 启动 ------------------------------ */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
